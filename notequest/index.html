<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar sticky-top border-bottom bg-body px-3">
    <span class="navbar-brand mb-0">NoteQuest</span>

    <ul class="nav nav-pills" id="main-nav">
      <li class="nav-item"><button class="nav-link" data-view="home">Home</button></li>
      <li class="nav-item"><button class="nav-link" data-view="notes">Notes</button></li>
      <li class="nav-item"><button class="nav-link" data-view="play">Play</button></li>
    </ul>

    <div class="d-flex align-items-center gap-2">
      <span class="badge level-badge" id="level-badge"></span>
      <button class="btn btn-sm btn-outline-secondary" id="theme-toggle">Light mode</button>
    </div>
  </nav>

  <main id="app" class="container-xl py-4"></main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

  <!-- Plain scripts (no modules) so the page also works when opened straight from the folder -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
